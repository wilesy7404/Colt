<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event prep — UI draft</title>
  <link rel="stylesheet" href="css/draft.css">
</head>
<body class="race">
  <div class="wrap">
    <header class="top">
      <a class="back" href="overview.html">Car</a>
      <div>
        <h1>Event prep</h1>
        <p class="sub">NASA Utah · 14 Jun 2024</p>
      </div>
    </header>
    <p><span class="chip blocked">Blocked</span></p>
    <p class="ex">Example data</p>
    <p class="lead">Critical defect open.</p>

    <section>
      <h2>Checklist</h2>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Brake pads, rotors, fluid</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Fluids and oils</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Tires</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Suspension</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Engine and drivetrain</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Wheels and studs</span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Lug nuts<small>80 ft-lb · Owner's manual p. 6-6 · approved by Colton 2026-10-25</small></span>
      </button>
      <button type="button" class="check" data-toggle="check" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span>Tools</span>
      </button>
    </section>
  </div>
  <nav class="nav" aria-label="Main">
    <a href="overview.html">Car</a>
    <a class="on" href="event-prep.html">Prep</a>
    <a href="session-log.html">Session</a>
    <a href="defects.html">Defects</a>
    <a href="log-maintenance.html">Log</a>
  </nav>
  <script src="js/draft.js"></script>
</body>
</html>
